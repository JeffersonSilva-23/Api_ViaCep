<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Cadastro de Cliente</h1>
    <form id="cadastroForm">
        <div class="loading" id="loading">Buscando endereço...</div>

        <label for="cep">CEP:</label>
        <input type="text" id="cep" maxlength="9" required onblur="buscarEndereco()" placeholder="00000-000">

        <label for="logradouro">Logradouro:</label>
        <input type="text" id="logradouro" readonly>

        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" readonly>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" readonly>

        <label for="uf">Estado (UF):</label>
        <input type="text" id="uf" readonly>

        <label for="numero">Número:</label>
        <input type="text" id="numero" required placeholder="Ex: 123">

        <button type="submit">Salvar Cadastro</button>

        <div class="success-message" id="successMessage">Cadastro realizado com sucesso!</div>
    </form>

<script src="script.js"></script>
</body>
</html>
